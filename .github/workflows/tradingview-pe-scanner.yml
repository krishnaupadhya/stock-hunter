name: Agent - TradingView PE Scanner

on:
  # Manual trigger: shows up as a "Run workflow" button in the Actions tab.
  workflow_dispatch: {}

  # Automated trigger: cron is always in UTC.
  # '30 3 * * 1-5' = 09:00 IST (UTC+5:30), Monday-Friday.
  schedule:
    - cron: '30 3 * * 1-5'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run agent
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
        run: npm start -- --agent=tradingview-pe-scanner
